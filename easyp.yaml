# Go code generation: protoc-gen-go (pinned in ./bin via `make configure`).
# Output: v1/*.pb.go in-tree (source_relative; go_package = module path).
lint:
  use:
    - DEFAULT
  allow_comment_ignores: false
  except:
    - PACKAGE_VERSION_SUFFIX
deps:
  - github.com/gopherex/schemapb@f659fab6ff192792cb71080845083fdc6638b2d5
generate:
  # Only our own protos are inputs. Pointing this at "." also picks up
  # easyp_vendor/, which compiles the vendored schemapb a second time and
  # fails on every symbol it already defined.
  inputs:
    - directory: v1
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
breaking:
  against_git_ref: main
