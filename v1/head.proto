syntax = "proto3";

option go_package = "github.com/graphene-ci/graphenepb/v1;graphenepbv1";

// Head says which published version of a kind is the current one.
//
// One record per kind name, stored apart from the shapes it points at,
// because the two are addressed differently: a head by the kind, a shape
// by the kind and the version. That split is what makes "the current
// version" a single read of an exact key rather than a search for the
// largest of something — and searching is not cheap, because the byte
// layer walks forward only and a key sorts "v10" before "v2".
//
// It is deliberately not a Resource. A resource carries its values in a
// StructValue, which would put this number behind a type assertion on the
// hottest read there is, and would need a definition of its own compiled
// in with an empty spec schema declared only so that a schema would
// exist. It would also have made a kind addressable through the generic
// resource API while its shapes are not — one concept split across two
// surfaces.
//
// The head is written AFTER the shape it points at, never before. Crash
// in between and there is an orphan version nobody looks at, which is
// harmless; the other order leaves a head pointing at nothing.
message Head {
  // Kind is which kind this is the head of, in the spelling its author
  // chose. The key folds case; this does not.
  string kind = 1;

  // Version is the published version that is current. Never zero: a head
  // exists because a shape was published, and pointing at version zero
  // would be pointing at the state before any was.
  uint32 version = 2;
}
