syntax = "proto3";

option go_package = "github.com/graphene-ci/graphenepb/v1;graphenepbv1";

/*
 * BlobService — the second and last primitive: big bytes on the side.
 * Everything meaningful about bytes (name, ownership, lifecycle) lives in
 * RESOURCES that reference blobs; the blob layer only stores and moves
 * content. Same service on all three planes (see resource.proto), only
 * transport and token differ.
 *
 * Addressing: BlobRef.id is an OPAQUE, server-issued handle — not a
 * content hash. Digests are demoted to what they really are here: an
 * integrity checksum (transfer verification, internal dedup, stable cache
 * keys R19) — never an address and never a user-facing concept.
 *
 * Lifecycle: an uploaded blob starts as an orphan owned by the uploading
 * scope; it survives GC only while reachable from some resource's
 * blob_refs (resource.proto). Publish-a-file = create/update a resource
 * (e.g. kind Artifact) referencing the blob.
 *
 * Errors as standard grpc statuses: NOT_FOUND (unknown/unreachable id),
 * INVALID_ARGUMENT (frames out of protocol), DATA_LOSS (declared checksum
 * does not match the computed one).
 */

/*
 * Digest — an integrity checksum over content. Never an address and never
 * a user-facing concept: transfer verification, internal dedup, stable
 * cache keys (R19).
 */
message Digest {
    DigestAlgo algo = 1;
    /* Raw hash bytes (32 bytes for sha256), NOT a hex string. */
    bytes value = 2;
}

enum DigestAlgo {
    DIGEST_ALGO_UNSPECIFIED = 0;
    DIGEST_ALGO_SHA256 = 1;
}

message BlobRef {
    /* Opaque server-issued handle. */
    string id = 1;
}

message BlobInfo {
    BlobRef ref = 1;
    uint64 size = 2;
    /* Integrity checksum computed by the server. Not an address. */
    Digest checksum = 3;
}

/* --- Upload: client stream: one open frame, then data frames --- */

message UploadRequest {
    oneof msg {
        /* Exactly one, first frame. */
        UploadOpen open = 1;
        /*
         * All subsequent frames. Ordering and integrity are the stream's
         * job. Recommended frame size 256KiB–1MiB (the transport caps
         * message size).
         */
        bytes data = 2;
    }
}

message UploadOpen {
    /*
     * Optional declaration: when the sender knows checksum/size upfront
     * the server verifies computed-vs-declared (mismatch = DATA_LOSS, blob
     * not stored). Unknown — leave zero: the server computes them.
     */
    Digest expected_checksum = 1;
    uint64 expected_size = 2;
}

message UploadResponse {
    BlobInfo info = 1;
}

/* --- Download: server stream: one info frame, then data frames --- */

message DownloadRequest {
    BlobRef ref = 1;
    /* Resume after a broken stream: send bytes starting at offset. */
    uint64 offset = 2;
    /* Frame size hint; the server may lower it. 0 = server's choice. */
    uint32 chunk_size = 3;
}

message DownloadResponse {
    oneof msg {
        /* Exactly one, first frame (full size — progress/preallocation). */
        BlobInfo info = 1;
        bytes data = 2;
    }
}

message StatRequest {
    BlobRef ref = 1;
}

message StatResponse {
    bool exists = 1;
    /* Set only when exists. */
    BlobInfo info = 2;
}

service BlobService {
    rpc Stat (StatRequest) returns (StatResponse);
    rpc Upload (stream UploadRequest) returns (UploadResponse);
    rpc Download (DownloadRequest) returns (stream DownloadResponse);
}
