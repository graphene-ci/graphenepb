syntax = "proto3";

// Its own proto package, so its messages may be named for what they do.
// Blobs are a service beside the kernel rather than part of it, and a
// flat namespace was making every name here apologise for one over there:
// a Delete that had to be called DeleteBlob because the kernel deletes
// things too.
package graphene.blob.v1;

option go_package = "github.com/graphene-ci/graphenepb/v1/blob;blobpb";

/*
 * Bytes, on a wire.
 *
 * A separate service from the kernel because it is a separate kind of
 * thing. A resource is a small value that travels the revision log and
 * every watch stream; a blob is somebody's binary, and putting one in the
 * log would mean every watcher downloading it to learn that it changed.
 * The kernel keeps what a blob IS — a reference in some resource's spec —
 * and this keeps the bytes.
 *
 * The id is opaque and the server issues it. A checksum is NOT an
 * address: two blobs with the same bytes are two blobs, deleting one does
 * not delete the other, and a caller that computed a hash has not thereby
 * learned where anything is. What the checksum is for is integrity — the
 * reader verifies what it got against what it was told.
 */
service BlobService {
  // Stat reports what is under an id, without moving the bytes.
  rpc Stat(StatRequest) returns (StatResponse);

  // Upload streams bytes in and returns the id they were given.
  //
  // Data frames, then one finish frame. The declaration comes LAST
  // because that is when a sender streaming a file knows it: a checksum
  // is what the bytes turned out to be, and demanding it up front would
  // mean reading everything twice or not declaring at all.
  //
  // A stream that ends without a finish frame is an upload nobody
  // completed, and nothing is stored. That is what makes abandoning one
  // a thing the wire can say rather than a thing the server has to guess
  // from a closed connection.
  rpc Upload(stream UploadRequest) returns (UploadResponse);

  // Download streams bytes out: one info frame, then data.
  //
  // The info comes first so a reader knows the size before the bytes and
  // can verify the checksum after them, without a second call.
  rpc Download(DownloadRequest) returns (stream DownloadResponse);

  // Delete removes a blob. Whoever calls it is asserting that nothing
  // refers to it any more; the kernel does not know, because a reference
  // lives in a resource's spec and this service does not read those.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

/* Ref is where bytes are: an opaque handle the server issued. */
message Ref {
  string id = 1;
}

/*
 * Checksum is what the bytes should hash to.
 *
 * The algorithm travels with the value because a bare 32 bytes is only
 * meaningful to a reader who already agreed which function produced them,
 * and "everyone knows it is sha256" is an agreement that lasts until the
 * day it does not.
 */
message Checksum {
  Algorithm algorithm = 1;
  bytes value = 2;
}

enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_SHA256 = 1;
}

/* Info is everything known about a blob without reading it. */
message Info {
  Ref ref = 1;
  uint64 size = 2;
  Checksum checksum = 3;
}

message StatRequest {
  Ref ref = 1;
}

message StatResponse {
  bool exists = 1;
  /* Set only when it exists. */
  Info info = 2;
}

message UploadRequest {
  oneof frame {
    /* The bytes. Order and integrity are the stream's. */
    bytes data = 1;
    /* Exactly one, and last. */
    UploadFinish finish = 2;
  }
}

/*
 * UploadFinish ends an upload and says what was sent.
 *
 * Both fields are optional: a sender that did not hash as it went cannot
 * say, and one that did should, because a declaration is what turns a
 * corrupted transfer into a refusal instead of a stored blob nobody
 * notices is wrong. What is NOT optional is the frame itself — without it
 * the upload is abandoned and nothing is stored.
 */
message UploadFinish {
  Checksum checksum = 1;
  uint64 size = 2;
}

message UploadResponse {
  Info info = 1;
}

message DownloadRequest {
  Ref ref = 1;
  /* Resume a broken transfer: start at this offset. */
  uint64 offset = 2;
}

message DownloadResponse {
  oneof frame {
    /* Exactly one, and first. */
    Info info = 1;
    bytes data = 2;
  }
}

message DeleteRequest {
  Ref ref = 1;
}

message DeleteResponse {}
